name: 'Copilot PR Reviewers'
# The Copilot agent requests review from whoever assigned it. For its PRs, request
# the web-reviewers team instead and drop individual reviewers.
on:
  pull_request_target:
    types: [ready_for_review, review_requested]

permissions: {}

jobs:
  request-team:
    # Copilot's PR author login is `Copilot`; the bot account is `copilot-swe-agent[bot]`.
    if: >-
      github.event.pull_request.user.login == 'Copilot' ||
      github.event.pull_request.user.login == 'copilot-swe-agent[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Request web-reviewers
        env:
          # Needs pull requests write and org members read; GITHUB_TOKEN cannot read org teams.
          GH_TOKEN: ${{ secrets.REVIEW_REQUEST_TOKEN }}
          ORG: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TEAM: web-reviewers
        run: |
          set -euo pipefail

          if ! gh api "orgs/$ORG/teams/$TEAM" --silent; then
            echo "::error::Team $ORG/$TEAM was not found or is not visible to the token; no reviewers were requested."
            exit 1
          fi

          current=$(gh api "repos/$REPO/pulls/$PR/requested_reviewers")

          if ! jq -e --arg t "$TEAM" '.teams[] | select(.slug == $t)' <<<"$current" >/dev/null; then
            gh api -X POST "repos/$REPO/pulls/$PR/requested_reviewers" -f "team_reviewers[]=$TEAM" --silent
          fi
