# This workflow will do a production build of the application, and test it end-to-end with the latest Deephaven Core server.

name: Build and End-to-end Tests

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - 'release/**'
      - 'feature/**'
env:
  DHC_VERSION: edge

jobs:
  build:
    runs-on: ubuntu-22.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and Save docker image
        run: |
          docker build -t e2e-ci:test -f ./tests/docker-scripts/Dockerfile .
          docker save e2e-ci -o e2e-ci.tar.gz

      - name: Store docker build for test matrix
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-cache
          path: e2e-ci.tar.gz
          retention-days: 1

  e2e-tests:
    runs-on: ubuntu-22.04
    needs: build
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-e2e-tests-${{ matrix.config }}
      cancel-in-progress: true

    strategy:
      fail-fast: false
      matrix:
        config: [chromium-1-1, firefox-1-1, webkit-1-2, webkit-2-2]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download docker image for test matrix
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-cache

      - name: Load docker image
        run: docker load -i e2e-ci.tar.gz

      - name: Extract browser config
        id: config
        env:
          MATRIX_CONFIG: ${{ matrix.config }}
        run: |
          echo "BROWSER=${MATRIX_CONFIG:0:-4}" >> $GITHUB_ENV
          echo "SHARD=${MATRIX_CONFIG: -3:1}" >> $GITHUB_ENV
          echo "SHARD_TOTAL=${MATRIX_CONFIG: -1:1}" >> $GITHUB_ENV

      - name: Run tests
        run: './tests/docker-scripts/run.sh e2e-ci-matrix'

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-blob-${{ matrix.config }}
          path: blob-report/
          retention-days: 1

      - name: Dump server logs
        if: failure()
        run: docker logs dhc-server > /tmp/server-log.txt

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-logs-${{ matrix.config }}
          path: /tmp/server-log.txt
          retention-days: 14

  record-new-tests:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-22.04
    needs: build
    # Recording is informational only - never block the PR on it.
    continue-on-error: true
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-record-new-tests
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Find added or modified e2e specs
        id: specs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CHANGED=$(git diff --name-only --diff-filter=AM "$BASE_SHA...$HEAD_SHA" -- 'tests/*.spec.ts')
          echo "Specs to record: ${CHANGED:-<none>}"
          echo "spec-files=$(echo "$CHANGED" | tr '\n' ' ' | sed 's/ *$//')" >> "$GITHUB_OUTPUT"
          {
            echo 'spec-list<<SPEC_LIST_EOF'
            echo "$CHANGED" | sed 's/^/- `/; s/$/`/'
            echo 'SPEC_LIST_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Download docker image
        if: steps.specs.outputs.spec-files != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-cache

      - name: Load docker image
        if: steps.specs.outputs.spec-files != ''
        run: docker load -i e2e-ci.tar.gz

      - name: Record specs
        if: steps.specs.outputs.spec-files != ''
        env:
          SPEC_FILES: ${{ steps.specs.outputs.spec-files }}
        run: './tests/docker-scripts/run.sh e2e-record'

      - name: Upload recordings
        id: upload
        if: ${{ steps.specs.outputs.spec-files != '' && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-new-test-videos
          path: test-results/e2e-video
          retention-days: 14
          if-no-files-found: ignore

      - name: Comment with recordings
        # Forked PRs get a read-only token, so the comment would fail.
        if: ${{ steps.upload.outputs.artifact-url != '' && !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: e2e-new-test-recordings
          message: |
            ### New e2e test recordings

            Recorded the e2e specs added or modified in this PR (chromium only):

            ${{ steps.specs.outputs.spec-list }}

            [Download the videos](${{ steps.upload.outputs.artifact-url }}) - expires in 14 days.

            Unzip the archive and open `index.html` to watch them.

      - name: Remove stale recordings comment
        if: ${{ steps.specs.outputs.spec-files == '' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: e2e-new-test-recordings
          delete: true

  merge-reports:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    needs: [e2e-tests]

    steps:
      - name: Download blob reports from GitHub Actions Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: playwright-report-blob-*

      - name: Merge into HTML Report
        run: |
          mkdir -p all-blob-reports
          mv playwright-report-blob-chromium-1-1/report-chromium-1.zip all-blob-reports/chromium-1-1.zip
          mv playwright-report-blob-firefox-1-1/report-firefox-1.zip all-blob-reports/firefox-1-1.zip
          mv playwright-report-blob-webkit-1-2/report-webkit-1.zip all-blob-reports/webkit-1-2.zip
          mv playwright-report-blob-webkit-2-2/report-webkit-2.zip all-blob-reports/webkit-2-2.zip
          npx playwright merge-reports --reporter html,github ./all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 30

  e2e-results:
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    needs: [e2e-tests]
    steps:
      - name: Fail if any tests failed or cancelled
        run: exit 1
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
