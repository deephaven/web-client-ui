# This workflow publishes packages to npm using trusted publishing
# It triggers on release creation to publish production packages
# It can also be manually triggered to publish alpha/canary packages
name: Publish Packages
on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      preid:
        description: 'Preid used to publish package. Must be unique per branch.'
        required: true
        default: 'alpha'
      ref:
        description: 'Commit to deploy from. Defaults to branch used for workflow_dispatch action.'
        required: false
        default: ''
jobs:
  publish-packages:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: npm ci
      - name: Build production
        run: npm run build
      - name: Publish canary packages
        # lerna's `--canary` differentiates runs via `+<sha>` build metadata,
        # which npm strips on publish, so every canary run for the same base
        # version would otherwise collide on the same published version
        # (e.g. 1.22.2-alpha.0). Folding the short SHA into the preid moves it
        # into the npm-visible prerelease segment, keeping versions unique
        # (e.g. 1.22.2-alpha.a1b2c3d.0). Matches the deephaven-plugins workflow.
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          PREID="${{ github.event.inputs.preid }}.$(git rev-parse --short HEAD)"
          ./node_modules/.bin/lerna publish --canary --preid "$PREID" --force-publish=\* --dist-tag canary --yes
      - name: Publish production packages
        if: ${{ github.event_name == 'release' }}
        run: ./node_modules/.bin/lerna publish from-package --yes
      - name: Update deephaven-core
        if: ${{ github.event_name == 'release' }}
        run: |
          curl -L \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.DEEPHAVENINTERNAL_PUBLIC_TOKEN }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/deephaven/deephaven-core/actions/workflows/update-web.yml/dispatches --data '{"ref": "main"}'
      - name: Create Jira release ticket
        # Posts to a Jira Automation "Incoming webhook" rule that creates the
        # "Update web version on G+" task and links the DH- issues in the notes
        if: ${{ github.event_name == 'release' }}
        continue-on-error: true
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_NOTES: ${{ github.event.release.body }}
          # Names the thing being updated in the ticket summary
          JIRA_COMPONENT: 'web'
          # Bump when the target enterprise release changes
          JIRA_FIX_VERSION: 'Grizzly Plus (2026.01, release/2026.01)'
          JIRA_WEBHOOK_URL: ${{ secrets.JIRA_AUTOMATION_WEBHOOK_URL }}
          JIRA_WEBHOOK_SECRET: ${{ secrets.JIRA_AUTOMATION_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          NOTES_WIKI=$(printf '%s' "$RELEASE_NOTES" \
            | sed -E 's/^#### /h4. /; s/^### /h3. /; s/^## /h2. /; s/^- /* /; s/\[([^]]*)\]\(([^)]*)\)/[\1|\2]/g; s/\*\*([^*]+)\*\*/*\1*/g')
          RELATED_ISSUES=$( { printf '%s' "$RELEASE_NOTES" | grep -oE 'DH-[0-9]+' || true; } \
            | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
          jq -n \
            --arg component "$JIRA_COMPONENT" \
            --arg version "$RELEASE_VERSION" \
            --arg releaseUrl "$RELEASE_URL" \
            --arg notesWiki "$NOTES_WIKI" \
            --arg fixVersion "$JIRA_FIX_VERSION" \
            --argjson relatedIssues "$RELATED_ISSUES" \
            '{component: $component, version: $version, releaseUrl: $releaseUrl, notesWiki: $notesWiki, fixVersion: $fixVersion, relatedIssues: $relatedIssues}' \
            | curl -fsS -X POST \
              -H 'Content-Type: application/json' \
              -H "X-Automation-Webhook-Token: $JIRA_WEBHOOK_SECRET" \
              --data @- "$JIRA_WEBHOOK_URL"
